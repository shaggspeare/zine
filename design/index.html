<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Travel Zine Generator, design</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{--bg:#ECE9E2;--panel:#F7F4EE;--ink:#1B1B1B;--muted:#5F5A50;--rule:#1B1B1B;--accent:#1F4E9C}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'PT Serif',Georgia,serif;height:100vh;display:flex}
aside{width:300px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--rule);overflow:auto;padding:20px 18px 32px;display:flex;flex-direction:column;gap:18px}
h1{font-family:Oswald,'Arial Narrow',sans-serif;font-weight:700;font-size:26px;line-height:1;text-transform:uppercase;color:var(--accent);margin:0}
.sub{font-size:12.5px;line-height:1.45;color:var(--muted);margin:6px 0 0}
.ctl{display:flex;flex-direction:column;gap:8px;border-top:2px solid var(--ink);padding-top:10px}
label{font-family:Oswald,sans-serif;font-weight:500;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
select{font:inherit;font-size:14px;padding:8px 10px;background:#fff;border:1px solid var(--ink);border-radius:0;color:var(--ink)}
select:disabled{opacity:.4}
.grp h2{font-family:Oswald,sans-serif;font-weight:500;font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin:0 0 6px;color:var(--muted)}
.grp a{display:block;padding:8px 10px;margin:0 -10px;color:var(--ink);text-decoration:none;font-size:14px;line-height:1.3;border-left:3px solid transparent}
.grp a:hover{background:#fff}
.grp a[aria-current=page]{background:#fff;border-left-color:var(--accent);font-weight:700}
main{flex-grow:1;min-width:0;display:flex;flex-direction:column}
.bar{display:flex;gap:16px;align-items:baseline;justify-content:space-between;padding:12px 20px;border-bottom:1px solid var(--rule);background:var(--panel)}
.bar a{color:var(--accent);font-size:13px}
.bar .t{font-family:Oswald,sans-serif;font-weight:700;font-size:16px;text-transform:uppercase}
.stage{flex-grow:1;overflow:auto;padding:24px;display:flex;justify-content:center;align-items:flex-start}
.frame{transform-origin:top left;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.12)}
.frame iframe{border:0;display:block;background:#fff}
.wrap{flex-shrink:0}
@media (max-width:820px){body{flex-direction:column;height:auto}aside{width:auto;border-right:0;border-bottom:1px solid var(--rule)}main{min-height:80vh}}
</style>
</head>
<body>
<aside>
<div><h1>Travel Zine Generator</h1><p class="sub">Design system, covers and inner pages for a printable A5 city booklet. Lisbon and Tokyo issues; four themes; English and Ukrainian.</p></div>
<div class="ctl">
<label for="theme">Theme</label>
<select id="theme"><option value="lisbon">Lisbon</option><option value="krakow">Kraków</option><option value="tokyo">Tokyo</option><option value="barcelona">Barcelona</option></select>
<label for="lang">Language</label>
<select id="lang"><option value="en">English</option><option value="uk">Українська</option></select>
</div>
<nav id="nav"></nav>
</aside>
<main>
<div class="bar"><span class="t" id="title"></span><a id="open" target="_blank" rel="noopener">Open page on its own</a></div>
<div class="stage" id="stage"><div class="wrap" id="wrap"><div class="frame" id="frame"><iframe id="fr" title="Design page"></iframe></div></div></div>
</main>

en"}, {"file": "DayPage-Alfama__krakow__uk.html", "theme": "krakow", "lang": "uk"}, {"file": "DayPage-Alfama__tokyo__en.html", "theme": "tokyo", "lang": "en"}, {"file": "DayPage-Alfama__tokyo__uk.html", "theme": "tokyo", "lang": "uk"}, {"file": "DayPage-Alfama__barcelona__en.html", "theme": "barcelona", "lang": "en"}, {"file": "DayPage-Alfama__barcelona__uk.html", "theme": "barcelona", "lang": "uk"}], "defaults": {"theme": "lisbon", "lang": "en"}, "w": 592, "h": 840, "hasTheme": true, "hasLang": true}, {"key": "Places-Light.dc.html", "title": "Places, light · Lisbon", "entries": [{"file": "Places-Light__lisbon__en.html", "theme": "lisbon", "lang": "en"}, {"file": "Places-Light__lisbon__uk.html", "theme": "lisbon", "lang": "uk"}, {"file": "Places-Light__krakow__en.html", "theme": "krakow", "lang": "en"}, {"file": "Places-Light__krakow__uk.html", "theme": "krakow", "lang": "uk"}, {"file": "Places-Light__tokyo__en.html", "theme": "tokyo", "lang": "en"}, {"file": "Places-Light__tokyo__uk.html", "theme": "tokyo", "lang": "uk"}, {"file": "Places-Light__barcelona__en.html", "theme": "barcelona", "lang": "en"}, {"file": "Places-Light__barcelona__uk.html", "theme": "barcelona", "lang": "uk"}], "defaults": {"theme": "lisbon", "lang": "en", "inverted": false}, "w": 592, "h": 840, "hasTheme": true, "hasLang": true}, {"key": "Places-Inverted.dc.html", "title": "Places, inverted · Lisbon", "entries": [{"file": "Places-Inverted__lisbon__en.html", "theme": "lisbon", "lang": "en"}, {"file": "Places-Inverted__lisbon__uk.html", "theme": "lisbon", "lang": "uk"}, {"file": "Places-Inverted__krakow__en.html", "theme": "krakow", "lang": "en"}, {"file": "Places-Inverted__krakow__uk.html", "theme": "krakow", "lang": "uk"}, {"file": "Places-Inverted__tokyo__en.html", "theme": "tokyo", "lang": "en"}, {"file": "Places-Inverted__tokyo__uk.html", "theme": "tokyo", "lang": "uk"}, {"file": "Places-Inverted__barcelona__en.html", "theme": "barcelona", "lang": "en"}, {"file": "Places-Inverted__barcelo var state = { key: NAV[0].items[0].key, theme: null, lang: null };
var nav = document.getElementById('nav');
NAV.forEach(function (g) {
  var d = document.createElement('div'); d.className = 'grp';
  var h = document.createElement('h2'); h.textContent = g.group; d.appendChild(h);
  g.items.forEach(function (it) {
    var a = document.createElement('a'); a.href = '#' + it.key; a.textContent = it.title; a.dataset.key = it.key; d.appendChild(a);
  });
  nav.appendChild(d);
});
function find(key) { for (var i = 0; i < NAV.length; i++) for (var j = 0; j < NAV[i].items.length; j++) if (NAV[i].items[j].key === key) return NAV[i].items[j]; return NAV[0].items[0]; }
var selT = document.getElementById('theme'), selL = document.getElementById('lang');
function show() {
  var b = find(state.key);
  var th = b.hasTheme ? (state.theme || b.defaults.theme) : null;
  var lg = b.hasLang ? (state.lang || b.defaults.lang) : null;
  selT.disabled = !b.hasTheme; selL.disabled = !b.hasLang;
  if (th) selT.value = th; if (lg) selL.value = lg;
  var e = b.entries.filter(function (x) { return x.theme === th && x.lang === lg; })[0] || b.entries[0];
  var fr = document.getElementById('fr');
  fr.width = b.w; fr.height = b.h;
  var url = 'pages/' + e.file;
  if (fr.getAttribute('src') !== url) fr.setAttribute('src', url);
  document.getElementById('title').textContent = b.title;
  var o = document.getElementById('open'); o.href = url;
  Array.prototype.forEach.call(nav.querySelectorAll('a'), function (a) { if (a.dataset.key === b.key) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  fit(b);
}
function fit(b) {
  var st = document.getElementById('stage');
  var avail = st.clientWidth - 48;
  var s = Math.min(1, avail / b.w);
  var fm = document.getElementById('frame'), wr = document.getElementById('wrap');
  fm.style.transform = 'scale(' + s + ')';
  wr.style.width = (b.w * s) + 'px'; wr.style.height = (b.h * s) + 'px';
}
function route() { var k = decodeURIComponent(location.hash.slice(1)); state.key = find(k).key; show(); }
selT.onchange = function () { state.theme = selT.value; show(); };
selL.onchange = function () { state.lang = selL.value; show(); };
window.addEventListener('hashchange', function () { state.theme = null; state.lang = null; route(); });
window.addEventListener('resize', function () { fit(find(state.key)); });
route();
</script>
